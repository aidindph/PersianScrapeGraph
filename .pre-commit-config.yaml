repos:
  # ── PersianScrapeGraph repo rule ─────────────────────────────────────
  # All commits must be authored by "Aidin Ghassemi"
  # <aidindph@users.noreply.github.com> (see CONTRIBUTING.md)
  - repo: local
    hooks:
      - id: commit-author-policy
        name: commit-author-policy (Aidin Ghassemi only)
        entry: bash scripts/check-commit-author.sh
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit, pre-push]

  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: mkdocs.yml
